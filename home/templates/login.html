{% extends 'principal.html' %}
{% load static %}
{% load django_bootstrap5 %}
{% block content %}
    <div class="card shadow m-3 col-md-6 mx-auto">
        <div class="card-body">
            <div class="row">
                <h3 class="text-center">{{ titulo }}</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        {% bootstrap_form form %}
                    </div>
                    <div class="d-grid d-sm-flex justify-content-sm-end gap-2 mt-4">
                        <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        {% bootstrap_button button_type="submit" content="Confirmar" button_class="btn btn-success" %}
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
