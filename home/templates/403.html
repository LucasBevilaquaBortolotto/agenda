{% extends 'principal.html' %}
{% block content %}
    <div class="container my-5 px-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow border-0 rounded-3 text-center">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-3">
                            <i class="fas fa-exclamation-triangle fa-3x text-danger opacity-75"></i>
                        </div>
                        <h3 class="card-title fw-bold text-dark mb-3">Controle de permissões</h3>
                        <div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger px-3 py-3 rounded-3 mb-4">
                            <p class="m-0 fs-6">
                                Você não tem permissão para acessar o módulo
                                <strong class="text-break">"{{ exception }}"</strong> no sistema.
                            </p>
                        </div>
                        <div class="d-grid gap-2 col-sm-6 mx-auto mt-2">
                            <a href="{% url 'index' %}" class="btn btn-secondary shadow-sm">
                                <i class="fas fa-arrow-left me-2"></i>Voltar ao Início
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
